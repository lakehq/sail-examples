name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and check the showcase
        env:
          SAIL_EXAMPLES_BASE: /sail/
        run: uv run pytest -q tests/test_output_presentation.py tests/test_site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            _site/
            site/vercel.json
          if-no-files-found: error
          retention-days: 1

  # Only this job sees the Vercel secrets. It runs no repository code or project
  # packages, only the pinned Vercel CLI.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://examples.lakesail.com/sail/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      # The site is built for /sail/, so it is served from a sail/ folder. The host root keeps
      # robots.txt and the 404 page.
      - name: Stage the deployment
        run: |
          mkdir .vercel-deploy
          cp -R _site .vercel-deploy/sail
          cp _site/404.html _site/robots.txt site/vercel.json .vercel-deploy/
      # The pinned CLI requires an explicit token when no credentials are saved.
      # Install scripts stay off, as for npm ci.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npx --yes vercel@50.23.2 deploy .vercel-deploy --prod --yes --token "$VERCEL_TOKEN"
