[project]
name = "sail-examples"
version = "0"
description = "Runnable, verified examples of Spark SQL and DataFrame code on Sail"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest>=8",
  "pyarrow>=17",
  "pyyaml>=6",
  "ruff>=0.6",
  "markdown-it-py==4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["examples(*ids): examples covered by a custom test or test module"]

[tool.ruff]
line-length = 110
target-version = "py311"
