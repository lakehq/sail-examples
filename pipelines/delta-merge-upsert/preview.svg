<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<style>:root{--background:#eff6ff;--ink:#172554;--row:#ffffff;--changed-row:#dbeafe;--arrow:#1e40af;--muted:#5b5f6a}@media(prefers-color-scheme:dark){:root{--background:#303d52;--ink:#e7eefc;--row:#39495f;--changed-row:#365880;--arrow:#93c5fd;--muted:#b7c3d6}}</style>

<title id="title">One merge, four customer changes</title>
<desc id="desc">Bo changes from silver to gold. Cy becomes Cyrus. Ed is deleted and Fay is inserted. Ana and Di stay unchanged.</desc>
